<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DropPoint – Gate Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>

<style>
    :root{
        --bg:#fff;
        --panel:#fff;
        --ink:#3b3b3b;
        --mut:#777;
        --soft:#e9e7e4;
        --line:#e3e1de;
        --mar:#9b2226;
        --warn:#f7d9d9;
        --ok:#049440;
        --blue:#0090e0;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px)
    }

    @media(prefers-color-scheme:dark){
        :root:not([data-theme=light]){
            --bg:#1b1a19;
            --panel:#272524;
            --ink:#e8e6e3;
            --mut:#a9a5a0;
            --soft:#363332;
            --line:#3d3a38;
            --mar:#e0686c;
            --warn:#4a2a2c
        }
    }

    :root[data-theme=dark]{
        --bg:#1b1a19;
        --panel:#272524;
        --ink:#e8e6e3;
        --mut:#a9a5a0;
        --soft:#363332;
        --line:#3d3a38;
        --mar:#e0686c;
        --warn:#4a2a2c
    }

    *{
        box-sizing:border-box
    }
    
    body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:Poppins,system-ui,sans-serif;
        font-size:15px
    }

    .wrap{
        max-width:1300px;
        margin:0 auto;
        padding:14px
    }

    .top{
        display:flex;
        align-items:center;
        gap:14px;
        flex-wrap:wrap;
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:22px;
        padding:10px 18px
    }

    .top img{
        height:54px
    }
    
    .sp{
        flex:1
    }
    
    .clk{
        font-size:30px;
        font-weight:700;
        color:var(--mar)
    }

    .top select{
        width:auto
    }

    .chip{
        border-radius:8px;
        padding:3px 10px;
        font-size:12px;
        font-weight:600;
        white-space:nowrap;
        display:inline-block
    }

    .c-ok{
        background:#d5f0df;
        color:#066a2d
    }
    
    .c-info{
        background:#dde4ee;
        color:#2b4a73
    }
    
    .c-warn{
        background:#fbe8b8;
        color:#7a5400
    }
    
    .c-bad{
        background:#f7cfd0;
        color:#8a1b1f
    }
    
    .c-n{
        background:var(--soft);
        color:var(--mut)
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(5,1fr);
        gap:10px;
        margin:12px 0
    }

    .card{
        color:#fff;
        border-radius:16px;
        padding:10px 14px
    }
    
    .card small{
        font-size:12px
    }
    
    .card b{
        display:block;
        font-size:24px
    }

    .main{
        display:grid;
        grid-template-columns:1.6fr 1fr;
        gap:14px
    }

    .disp{
        border-radius:26px;
        min-height:440px;
        padding:28px;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        text-align:center;
        gap:12px;
        background:var(--soft);
        color:var(--ink)
    }

    .disp.in{
        background:#049440;
        color:#fff
    }
    
    .disp.out{
        background:#0090e0;
        color:#fff
    }
    
    .disp.err{
        background:var(--mar);
        color:#fff
    }
    
    .disp.dup{
        background:#c98a00;
        color:#fff
    }

    .disp svg{
        width:80px;
        height:80px
    }
    
    .av{
        width:120px;
        height:120px;
        border-radius:50%;
        background:#fff;
        color:#333;
        display:grid;
        place-items:center;
        font-size:42px;
        font-weight:700
    }

    .disp h2{
        font-size:38px;
        margin:0
    }
    
    .big{
        font-size:30px;
        font-weight:700;
        background:#fff3;
        border-radius:16px;
        padding:6px 26px
    }

    .disp .btn{
        background:#fff;
        color:#9b2226
    }
    
    .disp .btn.g{
        background:#fff3;
        color:#fff
    }

    .bar{
        height:6px;
        background:#fff5;
        border-radius:6px;
        width:240px;
        overflow:hidden
    }
    
    .bar i{
        display:block;
        height:100%;
        background:#fff;
        animation:sh 7s linear forwards
    }
    
    @keyframes sh{
        from{width:100%}to{width:0}
    }

    @media(prefers-reduced-motion:reduce){
        .bar i{animation:none}
    }

    .panel{
        border:1px solid var(--line);
        border-radius:18px;
        padding:14px;
        margin-bottom:12px;
        background:var(--panel)
    }

    .panel h3{
        margin:0 0 8px;
        font-size:16px
    }

    .btn{
        background:var(--mar);
        color:#fff;border:0;
        border-radius:12px;
        padding:10px 18px;
        cursor:pointer;
        font:inherit;
        font-weight:600
    }
    
    .btn.g{
        background:var(--soft);
        color:var(--ink)
    }
    
    .btn.sm{
        padding:5px 11px;
        font-size:13px
    }

    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
        outline:3px solid var(--blue);
        outline-offset:2px
    }

    input,select,textarea{
        font:inherit;
        color:inherit;
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:12px;
        padding:10px 14px;
        width:100%
    }

    .scan{
        display:flex;
        gap:8px
    }
    
    .scan input{
        font-size:17px
    }

    .tabs{
        display:flex;
        gap:8px;
        margin:12px 0
    }
    
    .tabs button{
        border:0;
        background:var(--soft);
        color:var(--ink);
        padding:9px 20px;
        border-radius:99px;
        cursor:pointer;
        font:inherit;
        font-weight:600
    }
    
    .tabs .on{
        background:var(--mar);
        color:#fff
    }

    .log{
        max-height:340px;
        overflow:auto;
        display:flex;
        flex-direction:column;
        gap:6px
    }

    .lr{
        display:grid;
        grid-template-columns:64px 1fr auto;
        gap:8px;
        align-items:center;
        border:1px solid var(--line);
        border-radius:12px;
        padding:8px 10px;
        font-size:13px
    }
    
    .lr small{
        display:block;
        color:var(--mut)
    }

    .demo{
        display:flex;
        gap:6px;
        flex-wrap:wrap
    }

    .mask{
        position:fixed;
        inset:0;
        background:#0007;
        z-index:20;
        display:grid;
        place-items:center;
        padding:14px
    }

    .mod{
        background:var(--panel);
        border-radius:22px;
        padding:22px;
        max-width:520px;
        width:100%;
        max-height:92vh;
        overflow:auto
    }

    .pick{
        display:flex;
        flex-direction:column;
        gap:6px;
        max-height:170px;
        overflow:auto;
        margin:8px 0
    }
    
    .pick button{
        text-align:left;
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:10px;
        padding:8px 12px;
        font:inherit;
        color:inherit;
        cursor:pointer
    }

    .pick .on{
        border-color:var(--mar);
        background:var(--warn)
    }

    .row2{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin:8px 0
    }

    .gl{
        display:flex;
        flex-direction:column;
        gap:8px;
        margin:10px 0
    }

    .gl .btn{
        text-align:left
    }

    .toast{
        position:fixed;
        bottom:calc(20px + env(safe-area-inset-bottom,0px));
        left:50%;
        transform:translateX(-50%);
        background:#222;
        color:#fff;
        padding:10px 18px;
        border-radius:12px;
        z-index:30
    }

    label{
        font-size:13px;
        color:var(--mut)
    }
    
    @media(max-width:900px){
        .main{
            grid-template-columns:1fr
        }
        .cards{
            grid-template-columns:1fr 1fr
        }
        .disp{
            min-height:340px
        }
        .disp h2{
            font-size:30px
        }
    }
</style>
</head>
<body>
    <div class="wrap">
    <div id="app"></div></div>
    <div id="ov"></div>
    <script>
    const $=s=>document.querySelector(s),I=n=>`<i data-lucide="${n}"></i>`,pad=n=>String(n).padStart(2,'0');
    const tm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
    const ST=[['Maria Santos','G10 – Rizal','Elena Santos|Roberto Santos'],['Juan Dela Cruz','G8 – Bonifacio','Ana Dela Cruz'],['Ana Reyes','G12 – Mabini','Liza Reyes|Tomas Reyes'],['Pedro Lim','G9 – Luna','Grace Lim'],['Liza Mendoza','G9 – Luna','Carmen Mendoza'],['Carlo Bautista','G10 – Rizal','Ben Bautista'],['Jenny Aquino','G7 – Narra','Rosa Aquino'],['Mark Villar','G12 – Mabini','Joel Villar'],['Rica Manalo','G8 – Bonifacio','Elena Manalo'],['Sofia Ramos','G11 – STEM','Luis Ramos']].map((s,i)=>({id:'QR-'+(1001+i),lrn:'1370'+(5521+i),n:s[0],sec:s[1],g:s[2].split('|'),on:s[0]!='Pedro Lim',st:i%3==0?'in':'none',last:0}));
    const G={gate:'Main Gate',off:0,pend:0,tab:'scan',res:null,log:[],err:0,man:0,sel:null,q:'',tmr:null,ps:null};
    const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
    const chip=(c,t)=>`<span class="chip c-${c}">${t}</span>`;
    const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)};
    const find=v=>{v=v.trim().toLowerCase();return ST.find(s=>s.id.toLowerCase()==v||s.lrn==v)};
    function show(r){G.res=r;clearTimeout(G.tmr);if(r.k!='err'&&r.k!='dup')G.tmr=setTimeout(()=>{G.res=null;render()},7000);render()}
    function rec(s,dir,method,extra={}){s.st=dir=='IN'?'in':'out';s.last=Date.now();const e={t:extra.t||tm(),n:s.n,sec:s.sec,d:dir,m:method,gate:G.gate,man:extra.man,why:extra.why};G.log.unshift(e);if(G.off)G.pend++;return e}
    function scan(v,m){v=(v||'').trim();if(!v)return;const s=find(v);
    if(!s){G.err++;return show({k:'err',title:'ID not recognized',msg:'This code is not in the system. Do not turn the student away. Look up the student and use manual entry.',id:v,m})}
    if(!s.on){G.err++;return show({k:'err',title:'ID deactivated',msg:s.n+' has a deactivated ID. Verify the student, then use manual entry and report to admin.',id:v,m,s})}
    if(Date.now()-s.last<10000)return show({k:'dup',title:'Duplicate scan',msg:s.n+' was scanned a few seconds ago.',s,m});
    const dir=s.st=='in'?'OUT':'IN',e=rec(s,dir,m);show({k:dir=='IN'?'in':'out',s,dir,e,m})}
    const sms=r=>G.off?chip('warn','Offline: SMS queued')+' will send when connected':chip('ok','SMS sent')+' to parent of '+r.s.n.split(' ')[0]+' ('+'+63 9•• ••• 2210)';
    function display(){const r=G.res;
    if(!r)return`<div class="disp" aria-live="polite">${I('scan-line')}<h2>Ready to scan</h2><p>Tap your NFC ID on the reader or show your QR code to the camera.</p></div>`;
    if(r.k=='err'||r.k=='dup')return`<div class="disp ${r.k}" role="alert">${I(r.k=='dup'?'copy':'triangle-alert')}<h2>${r.title}</h2><p style="max-width:460px;margin:0">${r.msg}</p><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${r.k=='dup'?`<button class="btn" onclick="G.res=null;render()">Ignore</button><button class="btn g" onclick="forceRec()">Record anyway</button>`:`<button class="btn" onclick="manual('${r.id}')">Manual entry</button><button class="btn g" onclick="G.res=null;render()">Scan again</button><button class="btn g" onclick="toast('Admin notified')">Call admin</button>`}</div></div>`;
    return`<div class="disp ${r.k}" aria-live="polite"><div class="av">${ini(r.s.n)}</div><h2>${r.s.n}</h2><div style="font-size:20px">${r.s.sec} · ${r.s.lrn}</div><div class="big">TIME ${r.dir} · ${r.e.t}</div><div>${r.e.gate} · ${r.m} · ${r.e.man?'Manual':'Verified'}</div><div>${sms(r)}</div><div class="bar"><i></i></div></div>`}
    function forceRec(){const r=G.res,e=rec(r.s,r.s.st=='in'?'OUT':'IN',r.m);show({k:e.d=='IN'?'in':'out',s:r.s,dir:e.d,e,m:r.m})}
    function manual(id){G.sel=id&&find(id)?find(id).id:null;G.q='';const pre=id&&!find(id)?id:'';modal(manForm(pre))}
    function manForm(pre){const l=ST.filter(s=>s.n.toLowerCase().includes(G.q.toLowerCase())||s.lrn.includes(G.q));
    return`<h2 style="margin:0 0 4px">Manual entry</h2><p style="margin:0;color:var(--mut)">${pre?'Unreadable code: '+pre:'Record a student whose ID failed to scan.'}</p><label for="mq">Find student (name or LRN)</label><input id="mq" value="${G.q}" oninput="G.q=this.value;modal(manForm('${pre}'),1)"><div class="pick">${l.map(s=>`<button class="${G.sel==s.id?'on':''}" onclick="G.sel='${s.id}';modal(manForm('${pre}'),1)"><b>${s.n}</b> · ${s.sec} · ${s.lrn} ${s.on?'':chip('bad','Deactivated')}</button>`).join('')}</div><div class="row2"><div><label for="md">Direction</label><select id="md"><option>IN</option><option ${G.sel&&find(G.sel).st=='in'?'selected':''}>OUT</option></select></div><div><label for="mt">Time</label><input id="mt" type="time" step="1" value="${tm()}"></div></div><label for="mr">Reason</label><select id="mr"><option>Forgot ID</option><option>Damaged or unreadable card</option><option>ID not recognized</option><option>ID deactivated</option><option>Scanner error</option></select><label for="mn">Guard note</label><textarea id="mn" rows="2"></textarea><div style="display:flex;gap:10px;margin-top:12px"><button class="btn" onclick="saveMan()">Save entry</button><button class="btn g" onclick="modal()">Cancel</button></div>`}
    function saveMan(){const s=ST.find(x=>x.id==G.sel);if(!s)return toast('Select a student first');const d=$('#md').value,t=$('#mt').value,why=$('#mr').value+($('#mn').value?': '+$('#mn').value:'');G.man++;const e=rec(s,d,'Manual',{t:t.length==5?t+':00':t,man:1,why});modal();show({k:d=='IN'?'in':'out',s,dir:d,e,m:'Manual entry'});toast('Manual entry logged for admin review')}
    function modal(h,keep){const f=document.activeElement&&document.activeElement.id,p=document.activeElement&&document.activeElement.selectionStart;$('#ov').innerHTML=h?`<div class="mask"><div class="mod" role="dialog" aria-modal="true">${h}</div></div>`:'';lucide.createIcons();if(keep&&f&&$('#'+f)){$('#'+f).focus();try{$('#'+f).setSelectionRange(p,p)}catch(e){}}if(!h)setTimeout(()=>$('#sc')&&$('#sc').focus(),50)}
    function pickup(){const l=ST.filter(s=>s.st=='in'),s=ST.find(x=>x.id==G.ps);
    return`<div class="main"><div class="panel"><h3>Dismissal pickup verification</h3><p style="color:var(--mut)">Select the student, then confirm who is collecting them.</p><div class="pick" style="max-height:none">${l.map(x=>`<button class="${G.ps==x.id?'on':''}" onclick="G.ps='${x.id}';render()"><b>${x.n}</b> · ${x.sec}</button>`).join('')||'<p>No students on campus.</p>'}</div></div><div class="panel">${s?`<h3>${s.n}</h3><p style="color:var(--mut)">Registered guardians (dual-verification)</p><div class="gl">${s.g.map(g=>`<button class="btn" onclick="rel('${s.id}','${g}',1)">${I('shield-check')} Approve release to ${g}</button>`).join('')}<button class="btn g" onclick="rel('${s.id}','',0)">${I('shield-alert')} Someone else, not on file</button></div>`:'<p>Select a student to see authorized guardians.</p>'}</div></div>`}
    function rel(id,g,ok){const s=ST.find(x=>x.id==id);if(ok){rec(s,'OUT','Pickup');G.ps=null;toast(s.n+' released to '+g+'. Parent notified.')}else{G.err++;toast('Release denied. Admin alerted.')}render()}
    function demo(k){if(k=='qr'||k=='nfc'){const l=ST.filter(s=>s.on&&Date.now()-s.last>10000),s=l[Math.floor(Math.random()*l.length)];scan(s.id,k.toUpperCase())}
    if(k=='unk')scan('QR-9999','QR');if(k=='dea')scan('QR-1004','NFC');if(k=='dup'){const s=ST.find(x=>x.on&&Date.now()-x.last<10000)||ST.find(x=>x.on);if(Date.now()-s.last>10000)scan(s.id,'QR');scan(s.id,'QR')}}
