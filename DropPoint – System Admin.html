<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DropPoint – System Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>

<style>
    :root{
        --bg:#e8e6e3;
        --panel:#fff;
        --ink:#3b3b3b;
        --mut:#777;
        --soft:#d9d9d9;
        --line:#e3e1de;
        --mar:#9b2226;
        --warn:#f7d9d9;
        --ok:#049440;
        --amb:#c98a00;
        --blue:#0090e0;
        box-sizing:border-box;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px)
    }

    @media(prefers-color-scheme:dark){
        :root:not([data-theme=light]){
            --bg:#1b1a19;
            --panel:#272524;
            --ink:#e8e6e3;
            --mut:#a9a5a0;
            --soft:#363332;
            --line:#3d3a38;
            --mar:#e0686c;
            --warn:#4a2a2c
        }
    }

    :root[data-theme=dark]{
        --bg:#1b1a19;
        --panel:#272524;
        --ink:#e8e6e3;
        --mut:#a9a5a0;
        --soft:#363332;
        --line:#3d3a38;
        --mar:#e0686c;
        --warn:#4a2a2c
    }
    
    html{
        scroll-padding-top:env(safe-area-inset-top,0px)
    }

    *{
        box-sizing:border-box
    }
    
    body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:Poppins,system-ui,sans-serif;
        font-size:14px
    }

    .app{
        display:grid;
        grid-template-columns:270px 1fr;
        gap:8px;
        padding:14px;
        min-height:100vh
    }

    aside,main{
        background:var(--panel);
        border-radius:26px;
        padding:20px
    }

    aside{
        position:sticky;
        top:14px;
        height:calc(100vh - 28px);
        overflow:auto
    }

    .logo{
        text-align:center;
        margin-bottom:26px
    }

    .seal{
        display:block;
        width:100%;
        max-width:190px;
        height:auto;
        margin:0 auto
    }

    .logo b{
        color:var(--mar);
        font-size:19px;
        letter-spacing:.5px
    }

    nav a{
        display:flex;
        align-items:center;
        gap:14px;
        padding:11px 16px;
        margin:2px 0;
        border-radius:12px;
        color:var(--ink);
        text-decoration:none;
        font-weight:500;
        position:relative
    }

    nav a:hover{
        background:var(--soft)
    }
    
    nav a.on{
        color:var(--mar);
        font-weight:700
    }

    nav a.on:before{
        content:"";
        position:absolute;
        left:-20px;
        top:6px;
        bottom:6px;
        width:12px;
        border-radius:0 8px 8px 0;
        background:var(--mar)
    }

    nav i,nav svg{
        width:20px;
        height:20px
    }

    nav .bd{
        margin-left:auto;
        background:var(--mar);
        color:#fff;
        border-radius:99px;
        font-size:11px;
        padding:1px 8px
    }

    h1{color:var(--mar);
        font-size:24px;
        margin:0 0 18px;
        display:flex;
        align-items:center;
        gap:12px;
        flex-wrap:wrap
    }

    h1 .sp{
        flex:1
    }

    h2{
        font-size:18px;
        margin:22px 0 8px;
        font-weight:600
    }

    .pill{
        font-size:12px;
        font-weight:500;
        border-radius:99px;
        padding:4px 12px;
        background:var(--soft);
        color:var(--ink)
    }

    .pill.bad{
        background:var(--mar);
        color:#fff
    }
    
    .pill.good{
        background:var(--ok);
        color:#fff
    }

    .strip{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        background:var(--warn);
        border-radius:18px;
        padding:10px 16px
    }

    .strip.okay{
        background:var(--soft)
    }

    .strip>div{
        padding:2px 14px;
        border-left:2px solid #b9a9a9;
        display:flex;
        flex-direction:column;
        gap:4px
    }
    
    .strip>div:first-child{
        border:0;
        padding-left:0
    }

    .strip small{
        color:var(--mut);
        display:flex;
        justify-content:space-between
    }

    .row{
        display:flex;
        gap:18px;
        flex-wrap:wrap;
        align-items:center;font-weight:600
    }

    .num{
        background:var(--panel);
        border-radius:14px;
        padding:2px 14px;
        font-weight:700;
        font-size:16px;
        margin-left:4px
    }

    .dot{
        display:inline-block;
        width:9px;
        height:9px;
        border-radius:50%;
        margin-right:5px
    }
    
    .cards{
        display:grid;
        grid-template-columns:repeat(5,1fr);
        gap:12px
    }

    .card{
        color:#fff;
        border-radius:18px;
        padding:14px 16px;
        min-height:120px
    }

    .card small{
        display:flex;
        gap:8px;
        align-items:center;
        font-size:13px
    }

    .card small svg{
        width:16px;
        height:16px
    }

    .card b{
        display:block;
        font-size:28px;
        margin-top:22px;
        letter-spacing:.5px
    }

    .split{
        display:grid;
        grid-template-columns:1.7fr 1fr;
        gap:14px
    }

    .box{
        background:var(--soft);
        border-radius:18px;
        padding:10px;
        max-height:420px;
        overflow:auto
    }

    .panel{
        border:1px solid var(--line);
        border-radius:18px;
        padding:14px;
        margin-bottom:14px
    }

    .feed{
        display:flex;
        flex-direction:column;
        gap:6px
    }

    .fr{
        display:grid;
        grid-template-columns:70px 64px 1fr 120px 100px 22px;
        gap:8px;
        align-items:center;
        background:var(--panel);
        border-radius:12px;
        padding:8px 12px;
        font-size:13px
    }

    .fr.new{
        animation:hl 1.2s
    }

    @keyframes hl{
        from{
            background:#bfe8cd
        }
    }

    @media(prefers-reduced-motion:reduce){
        .fr.new{
            animation:none
        }
    }

    .chip{
        border-radius:8px;
        padding:2px 8px;
        font-size:11px;
        font-weight:600;
        white-space:nowrap;
        display:inline-block
    }

    .c-in,.c-ok{
        background:#d5f0df;
        color:#066a2d
    }

    .c-out,.c-info{
        background:#dde4ee;
        color:#2b4a73
    }

    .c-warn{
        background:#fbe8b8;
        color:#7a5400
    }

    .c-bad{
        background:#f7cfd0;
        color:#8a1b1f
    }

    .tiles{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px
    }

    .tile{
        background:var(--panel);
        border-radius:14px;
        padding:12px;
        border:2px solid transparent;
        cursor:pointer;
        text-align:left;
        font:inherit;
        color:inherit
    }

    .tile.w{
        border-color:var(--amb)
    }

    .tile.c{
        border-color:var(--mar);
        background:var(--warn)
    }

    .tile small{
        display:flex;
        gap:6px;
        align-items:center;
        color:var(--mut)
    }

    .tile svg{
        width:16px;
        height:16px
    }

    .tile b{
        font-size:28px;
        display:block
    }

    .tile em{
        font-style:normal;
        font-size:12px;
        color:var(--mut)
    }

    table{
        width:100%;
        border-collapse:collapse
    }

    th{
        text-align:left;
        color:var(--mut);
        font-weight:500;
        font-size:12px;
        padding:8px
    }

    td{
        padding:10px 8px;
        border-top:1px solid var(--line);
        vertical-align:middle
    }

    .wrap{
        overflow-x:auto
    }

    button,input,select,textarea{
        font:inherit;
        color:inherit
    }

    .btn{
        background:var(--mar);
        color:#fff;
        border:0;
        border-radius:10px;
        padding:7px 14px;
        cursor:pointer;
        font-weight:600
    }

    .btn.ghost{
        background:var(--soft);
        color:var(--ink)
    }
    
    .btn:focus-visible,a:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
        outline:3px solid var(--blue);
        outline-offset:2px
    }

    input,select,textarea{
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:10px;
        padding:8px 12px;
        width:100%
    }

    .g2{display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px
    }
    
    .g3{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:14px
    }

    .stat{
        background:var(--soft);
        border-radius:16px;
        padding:14px
    }
    
    .stat b{
        font-size:26px;
        display:block
    }
    
    .stat small{
        color:var(--mut)
    }

    .bars{
        display:flex;
        align-items:flex-end;
        gap:10px;
        height:160px
    }
    
    .bars div{
        flex:1;
        text-align:center;
        font-size:11px;
        color:var(--mut)
    }

    .bars span{
        display:block;
        background:var(--mar);
        border-radius:8px 8px 0 0;
        margin-bottom:4px
    }

    .tabs{
        display:flex;
        gap:8px;
        margin-bottom:10px
    }
    
    .tabs button{
        border:0;
        background:var(--soft);
        padding:7px 16px;
        border-radius:99px;
        cursor:pointer
    }
    
    .tabs .on{
        background:var(--mar);
        color:#fff
    }

    .tl{
        border-left:3px solid var(--mar);
        padding-left:14px;
        margin:10px 0
    }
    
    .tl p{
        margin:0 0 10px
    }

    .sw{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:10px 0;
        border-top:1px solid var(--line)
    }

    .toast{
        position:fixed;
        bottom:calc(20px + env(safe-area-inset-bottom,0px));
        left:50%;
        transform:translateX(-50%);
        background:#222;
        color:#fff;
        padding:10px 18px;
        border-radius:12px;
        z-index:9
    }

    .muted{
        color:var(--mut)
    }

    @media(max-width:900px){
        .app{
            grid-template-columns:1fr;
            padding:8px
        }
        aside{
            position:static;
            height:auto;
            padding:12px
        }
        .logo{display:none}
        nav{display:flex;overflow-x:auto;gap:4px}
        nav a{white-space:nowrap;padding:9px 12px}
        nav a.on:before{display:none}
        nav a.on{background:var(--soft)}
    }

    .cards,.split,.g2,.g3,.strip{
        grid-template-columns:1fr 1fr
    }

    .split{
        grid-template-columns:1fr
    }

    .strip{
        grid-template-columns:1fr
    }

    .strip>div{
        border:0;padding:6px 0
    }

    .fr{
        grid-template-columns:60px 54px 1fr 22px
    }

    .fr .hm{
        display:none
    }

    .card b{
        font-size:22px
    }
    
    @media(max-width:520px){
        .cards,.g2,.g3{
            grid-template-columns:1fr
        }
    }

</style>
</head>
<body>
    <div class="app">
        <aside><div class="logo"><img class="seal" src="logo.png" alt="DropPoint logo"></div>
        <nav id="nav" aria-label="Main"></nav>
        </aside>
        <main id="main"></main>
    </div>

    <script>
    const $=s=>document.querySelector(s),I=(n,c='')=>`<i data-lucide="${n}" class="${c}"></i>`;
    const NAV=[['overview','layout-dashboard','Overview'],['discrepancies','radar','Discrepancies'],['pickups','shield-check','Pickups'],['alerts','siren','Alerts'],['sms','message-square-text','SMS Monitor'],['records','contact','Records'],['users','users','Users & Logs'],['reports','chart-column','Reports'],['health','activity','System Health'],['settings','settings','Settings']];
    const NM=['Maria Santos','Juan Dela Cruz','Ana Reyes','Pedro Lim','Liza Mendoza','Carlo Bautista','Jenny Aquino','Mark Villar','Rica Manalo','Paolo Cruz','Sofia Ramos','Diego Torres'];
    const SEC=['G7 – Narra','G8 – Bonifacio','G9 – Luna','G10 – Rizal','G11 – STEM','G12 – Mabini'];
    const pick=a=>a[Math.floor(Math.random()*a.length)],pad=n=>String(n).padStart(2,'0');
    const now=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())};
    const S={enr:1248,campus:1012,na:156,dep:38,abs:42,pend:2,bal:450,sound:true,
    gates:[{n:'Main Gate',on:1,hb:'4s',bat:86,v:'1.2.0'},{n:'Back Gate',on:0,hb:'6m',bat:12,v:'1.2.0'},{n:'Gym Gate',on:1,hb:'9s',bat:64,v:'1.1.9'},{n:'Side Gate',on:1,hb:'3s',bat:71,v:'1.2.0'}],
    feed:[],
    disc:[{id:1,n:'Liza Mendoza',s:'G9 – Luna',t:'Scanned in, absent in class',p:'P3 Science',m:18,st:'Open'},{id:2,n:'Carlo Bautista',s:'G10 – Rizal',t:'Scanned in, absent in class',p:'P3 Math',m:12,st:'Open'},{id:3,n:'Jenny Aquino',s:'G7 – Narra',t:'In class, no gate scan',p:'P2 English',m:55,st:'Under review'},{id:4,n:'Mark Villar',s:'G12 – Mabini',t:'Scanned in, absent in class',p:'P3 PE',m:7,st:'Open'}],
    queue:[{id:1,n:'Rica Manalo',s:'G8 – Bonifacio',g:'Elena Manalo (Mother)',ok:1},{id:2,n:'Paolo Cruz',s:'G7 – Narra',g:'Unknown: Ramon Diaz',ok:0}],
    plog:[{t:'15:42:10',n:'Sofia Ramos',g:'Luis Ramos (Father)',by:'Guard Reyes',r:'Approved'},{t:'15:38:51',n:'Diego Torres',g:'Cora Torres (Aunt)',by:'Guard Reyes',r:'Approved'}],
    alerts:[{t:'Nov 6, 10:14',a:'Grade 9 only',m:'Class suspended after 3 PM due to weather.',by:'Sys Admin'}],
    fsms:[{id:1,to:'+63 917 ••• 2210',m:'Time-in: Ana Reyes 07:41',e:'No signal'},{id:2,to:'+63 928 ••• 7731',m:'Time-out: Pedro Lim 15:30',e:'Timeout'},{id:3,to:'+63 905 ••• 1184',m:'Time-in: Mark Villar 07:55',e:'Invalid number'}],
    users:[{n:'Dr. Elena Cruz',r:'School Admin',on:1},{n:'Mr. Ben Soriano',r:'Teacher',on:1},{n:'Guard Reyes',r:'Gate Guard',on:1},{n:'Ms. Ivy Lopez',r:'Teacher',on:0}],
    audit:[['09:12','Sys Admin','Revealed guardian contact','Maria Santos'],['09:05','Dr. Cruz','Exported attendance CSV','Grade 10'],['08:47','Sys Admin','Reissued QR ID','Pedro Lim'],['08:30','Guard Reyes','Approved pickup','Sofia Ramos']]};
    function scan(){const on=S.gates.filter(g=>g.on),dir=Math.random()<.7?'IN':'OUT',st=Math.random()<.08?'dup':'';
    S.feed.unshift({t:now(),d:dir,n:pick(NM),s:pick(SEC),g:pick(on).n,m:Math.random()<.7?'qr-code':'smartphone-nfc',st,fresh:1});S.feed=S.feed.slice(0,50);
    if(!st){if(dir=='IN'){S.campus++;S.na=Math.max(0,S.na-1)}else{S.campus--;S.dep++}}}
    for(let i=0;i<9;i++){scan();S.feed[0].fresh=0}
    let route='overview',tab='Students',q='',trace=null;
    const ADMIN_DATA_KEY='dropPointAdminData';
    const seedStudents=[['Maria Santos','G10 – Rizal','QR-1001','Active'],['Juan Dela Cruz','G8 – Bonifacio','NFC-2044','Active'],['Ana Reyes','G12 – Mabini','QR-1388','Active'],['Pedro Lim','G9 – Luna','QR-1420','Reissue'],['Liza Mendoza','G9 – Luna','NFC-2210','Active'],['Rica Manalo','G8 – Bonifacio','QR-2001','Active'],['Sofia Ramos','G11 – STEM','QR-2002','Active'],['Diego Torres','G8 – Bonifacio','QR-2003','Active']];
    const seedGuardians=[['Elena Manalo','Rica Manalo','Mother','ID verified','NFC','NFC-G-2001'],['Luis Ramos','Sofia Ramos','Father','ID verified','QR','QR-G-2002'],['Cora Torres','Diego Torres','Aunt','Pending ID','','']];
    const savedAdminRecords=JSON.parse(localStorage.getItem(ADMIN_DATA_KEY)||'null');
    const studentRecords=savedAdminRecords&&Array.isArray(savedAdminRecords.students)?savedAdminRecords.students:seedStudents;
    const guardianRecords=savedAdminRecords&&Array.isArray(savedAdminRecords.guardians)?savedAdminRecords.guardians:seedGuardians;
    function saveAdminRecords(){const saved=JSON.parse(localStorage.getItem(ADMIN_DATA_KEY)||'{}'),data=saved&&typeof saved=='object'&&!Array.isArray(saved)?saved:{};data.students=studentRecords;data.guardians=guardianRecords;localStorage.setItem(ADMIN_DATA_KEY,JSON.stringify(data))}
    saveAdminRecords();
    const openD=()=>S.disc.filter(d=>d.st!='Resolved'),unv=()=>S.queue.filter(x=>!x.ok).length;
    const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
    const issues=()=>S.gates.filter(g=>!g.on).length+(S.fsms.length?1:0)+(S.pend>10?1:0);
    const chip=(c,t)=>`<span class="chip c-${c}">${t}</span>`;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stc={Open:'bad','Under review':'warn',Resolved:'ok',Approved:'ok',Denied:'bad'};
    const tbl=(h,r)=>`<div class="wrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const head=(t,x='')=>`<h1>${t}<span class="sp"></span>${x}<span class="pill ${issues()?'bad':'good'}">${issues()?issues()+' issues':'All systems normal'}</span></h1>`;
    function nav(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<a href="#${k}" class="${k==route?'on':''}" ${k==route?'aria-current="page"':''}>${I(i)}${l}${k=='discrepancies'&&openD().length?`<span class="bd">${openD().length}</span>`:''}</a>`).join('')}
    const feedRow=f=>`<div class="fr ${f.fresh?'new':''}"><span class="muted">${f.t}</span>${chip(f.d=='IN'?'in':'out',f.d=='IN'?'↳ IN':'↰ OUT')}<span><b>${f.n}</b> ${f.st?chip('warn','Duplicate scan'):''}</span><span class="hm">${f.s}</span><span class="hm">${f.g}</span>${I(f.m)}</div>`;
    const P={
    overview(){const off=S.gates.filter(g=>!g.on).length,on=S.gates.length-off,fs=S.fsms.length,d=openD().length,u=unv();
    const tile=(k,i,l,n,ctx,cls)=>`<button class="tile ${n?cls:''}" onclick="go('${k}')">${'<small>'+I(i)+l+'</small>'}<b>${n}</b><em>${n?ctx:'All clear'}</em></button>`;
    const C=[['#0090e0','users','Total Enrolled',S.enr],['#049440','building-2','On Campus',S.campus],['#6b3f37','hourglass','Not Arrived',S.na],['#2b2b1b','log-out','Departed',S.dep],['#96282d','user-x','Absent',S.abs]];
    return head('Command Center')+`<h2 style="margin-top:0">Status</h2><div class="strip ${off?'':'okay'}"><div><small>Gate Terminals</small><div class="row"><span><span class="dot" style="background:#049440"></span>Online:<span class="num">${on}</span></span><span><span class="dot" style="background:#e00"></span>Offline:<span class="num">${off}</span></span></div></div><div><small>SMS Gateway<span style="color:#049440;font-style:italic">Connected</span></small><div class="row">Balance:<span class="num">₱ ${S.bal.toFixed(2)}</span></div></div><div><small>Sync Queue<i>Last sync 2m ago</i></small><div class="row"><span><span class="dot" style="background:#e6c200"></span>Pending:<span class="num">${S.pend}</span></span></div></div></div>
    <h2>Summary</h2><div class="cards">${C.map(c=>`<div class="card" style="background:${c[0]}"><small>${I(c[1])}${c[2]}</small><b>${c[3].toLocaleString()}</b></div>`).join('')}</div>
    <div class="split"><div><h2>Live Tap Feed</h2><div class="box"><div class="feed" id="feed">${S.feed.map(feedRow).join('')}</div></div></div><div><h2>Needs Attention</h2><div class="tiles">${tile('alerts','siren','Emergency',0,'','c')}${tile('discrepancies','radar','Discrepancies',d,'oldest '+Math.max(...openD().map(x=>x.m),0)+' min','w')}${tile('sms','message-square-warning','Failed SMS',fs,'Retry in SMS Monitor','w')}${tile('pickups','shield-alert','Unverified Pickups',u,'Review now','c')}</div></div></div>`},
    discrepancies(){return head('Discrepancies')+`<p class="muted">Gate scans compared with classroom attendance. Select a status to move a flag forward.</p><div class="panel">${tbl(['Student','Section','Type','Period','Unaccounted','Status',''],S.disc.map(d=>[`<b>${d.n}</b>`,d.s,d.t,d.p,d.m+' min',chip(stc[d.st],d.st),d.st=='Resolved'?'':`<button class="btn ghost" onclick="adv(${d.id})">${d.st=='Open'?'Start review':'Mark resolved'}</button>`]))}</div>`},
    pickups(){return head('Pickups')+`<h2 style="margin-top:0">Dismissal queue</h2><div class="panel">${S.queue.length?tbl(['Student','Section','Guardian','Match',''],S.queue.map(x=>[`<b>${x.n}</b>`,x.s,x.g,x.ok?chip('ok','Registered guardian'):chip('bad','Not on file'),`<button class="btn" onclick="rel(${x.id},1)">Approve</button> <button class="btn ghost" onclick="rel(${x.id},0)">Deny</button>`])):'<p class="muted">No students waiting for release.</p>'}</div><h2>Handoff ledger</h2><div class="panel">${tbl(['Time','Student','Guardian','Verified by','Result'],S.plog.map(x=>[x.t,x.n,x.g,x.by,chip(stc[x.r],x.r)]))}</div>`},
    alerts(){return head('Alerts')+`<div class="g2"><div class="panel"><h2 style="margin-top:0">Emergency broadcast</h2><label>Audience<select id="aud"><option>All parents</option><option>Grade 7 only</option><option>Grade 9 only</option><option>Grade 12 only</option></select></label><p><label>Message<textarea id="msg" rows="3" placeholder="Type the SMS to send"></textarea></label></p><button class="btn" onclick="bcast()">Send broadcast</button></div><div class="panel"><h2 style="margin-top:0">Last seen trace</h2><input id="tq" placeholder="Search student name" value="${trace?trace.n:''}"><p><button class="btn" onclick="doTrace()">Trace student</button></p>${trace?`<div class="tl"><p><b>${trace.n}</b> · ${trace.s}</p><p>07:42 Gate scan in (Main Gate)</p><p>08:00 Class check: present (P1)</p><p>10:05 Class check: absent (P3)</p><p>No gate scan out. No pickup recorded.</p></div>`:'<p class="muted">Shows the last gate scan, class check and pickup for one student.</p>'}</div></div><h2>Alert history</h2><div class="panel">${tbl(['Sent','Audience','Message','By'],S.alerts.map(a=>[a.t,a.a,a.m,a.by]))}</div>`},
    sms(){return head('SMS Monitor')+`<div class="g3"><div class="stat"><small>Delivery rate today</small><b>${(98.2).toFixed(1)}%</b></div><div class="stat"><small>Average dispatch time</small><b>1.8 s</b></div><div class="stat"><small>Load balance</small><b>₱ ${S.bal.toFixed(2)}</b></div></div><h2>Failed messages</h2><div class="panel">${S.fsms.length?`<p><button class="btn" onclick="retry()">Retry all</button></p>`+tbl(['To','Message','Reason',''],S.fsms.map(f=>[f.to,f.m,chip('bad',f.e),`<button class="btn ghost" onclick="retry(${f.id})">Retry</button>`])):'<p class="muted">No failed messages.</p>'}</div><h2>Message templates</h2><div class="g2"><div class="panel"><b>Time-in</b><textarea rows="2">DropPoint: {student} arrived at school at {time}.</textarea></div><div class="panel"><b>Time-out</b><textarea rows="2">DropPoint: {student} left school at {time}.</textarea></div></div><button class="btn" onclick="toast('Templates saved')">Save templates</button>`},
    records(){const students=studentRecords.filter(r=>r.join(' ').toLowerCase().includes(q.toLowerCase())),guardians=guardianRecords.filter(r=>r.join(' ').toLowerCase().includes(q.toLowerCase()));
    const studentForm=`<div class="panel"><h2 style="margin-top:0">Add student</h2><div class="g3"><input id="studentName" aria-label="Student name" placeholder="Student name"><select id="studentSection" aria-label="Section">${SEC.map(s=>`<option>${esc(s)}</option>`).join('')}</select><input id="studentTag" aria-label="Student ID tag" placeholder="Unique student ID tag"></div><p><button class="btn" onclick="registerStudent()">Add student</button></p></div>`;
    const guardianForm=`<div class="panel"><h2 style="margin-top:0">Register guardian and issue card</h2><p class="muted">Assign each guardian to a student and register their NFC or QR card. Keep identity status pending until the guardian's ID has been verified.</p><div class="g3"><input id="guardianName" aria-label="Guardian name" placeholder="Guardian name"><select id="guardianStudent" aria-label="Student">${studentRecords.map(s=>`<option value="${esc(s[0])}">${esc(s[0])} · ${esc(s[1])}</option>`).join('')}</select><input id="guardianRelation" aria-label="Relationship to student" placeholder="Relationship"></div><div class="g3" style="margin-top:10px"><select id="guardianCardType" aria-label="Guardian card type"><option value="">Card type</option><option>NFC</option><option>QR</option></select><input id="guardianCardId" aria-label="Guardian card ID" placeholder="Unique NFC / QR card ID"><select id="guardianVerification" aria-label="Identity verification status"><option>Pending ID</option><option>ID verified</option></select></div><p><button class="btn" onclick="registerGuardian()">Register guardian</button></p></div>`;
    const studentRows=students.map(r=>{const i=studentRecords.indexOf(r);return [`<b>${esc(r[0])}</b>`,esc(r[1]),esc(r[2]),chip(r[3]=='Active'?'ok':'warn',esc(r[3])),`<button class="btn ghost sm" onclick="deleteStudent(${i})">Delete</button>`]});
    const guardianRows=guardians.map(g=>{const i=guardianRecords.indexOf(g);return [`<b>${esc(g[0])}</b>`,esc(g[1]),esc(g[2]),`<select id="guardianStatus${i}" aria-label="Identity status for ${esc(g[0])}"><option ${g[3]=='Pending ID'?'selected':''}>Pending ID</option><option ${g[3]=='ID verified'?'selected':''}>ID verified</option></select>`,`<select id="guardianType${i}" aria-label="Card type for ${esc(g[0])}"><option value="" ${!g[4]?'selected':''}>Unassigned</option><option ${g[4]=='NFC'?'selected':''}>NFC</option><option ${g[4]=='QR'?'selected':''}>QR</option></select>`,`<input id="guardianTag${i}" aria-label="Card ID for ${esc(g[0])}" value="${esc(g[5]||'')}" placeholder="Unique card ID">`,g[3]=='ID verified'&&g[4]&&g[5]?chip('ok','Verified card'):chip('warn',g[3]=='Pending ID'?'Pending ID':'Card needed'),`<button class="btn sm" onclick="saveGuardian(${i})">Save</button> <button class="btn ghost sm" onclick="deleteGuardian(${i})">Delete</button>`]});
    return head('Records','<button class="btn" onclick="toast(\'Select a CSV to import\')">Bulk import CSV</button>')+`<div class="tabs">${['Students','Guardians'].map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';q='';render()">${t}</button>`).join('')}</div>${tab=='Students'?studentForm:guardianForm}<input id="rq" placeholder="Search ${tab.toLowerCase()}" value="${esc(q)}" oninput="q=this.value;render(1)" style="max-width:320px;margin-bottom:10px"><div class="panel">${tbl(tab=='Students'?['Name','Section','ID tag','Status','']:['Guardian','Student','Relation','Identity status','Card type','Card ID','Card status',''],tab=='Students'?studentRows:guardianRows)}</div>`},
    users(){return head('Users & Logs')+`<div class="panel">${tbl(['Name','Role','Account',''],S.users.map((u,i)=>[`<b>${u.n}</b>`,u.r,chip(u.on?'ok':'bad',u.on?'Active':'Disabled'),`<button class="btn ghost" onclick="S.users[${i}].on^=1;render()">${u.on?'Disable':'Enable'}</button>`]))}</div><h2>Access trail</h2><div class="panel">${tbl(['Time','User','Action','Record'],S.audit)}</div>`},
    reports(){const d=[['Mon',96],['Tue',95],['Wed',97],['Thu',93],['Fri',90]],h=[['6',20],['7',92],['8',45],['12',25],['15',88],['16',40]];const bar=a=>`<div class="bars">${a.map(x=>`<div><span style="height:${x[1]*1.4}px"></span>${x[0]}</div>`).join('')}</div>`;
    return head('Reports','<button class="btn" onclick="toast(\'Report exported\')">Export CSV</button>')+`<div class="g2"><div class="panel"><b>Daily attendance rate (%)</b>${bar(d)}</div><div class="panel"><b>Peak gate traffic (hour of day)</b>${bar(h)}</div></div><div class="g3"><div class="stat"><small>Late arrivals this week</small><b>64</b></div><div class="stat"><small>Early departures</small><b>21</b></div><div class="stat"><small>Average on-campus time</small><b>8h 12m</b></div></div>`},
    health(){return head('System Health')+`<div class="g3"><div class="stat"><small>Scan latency (avg)</small><b>0.6 s</b></div><div class="stat"><small>SMS success rate</small><b>98.2%</b></div><div class="stat"><small>Discrepancy accuracy</small><b>94%</b></div></div><h2>Device registry</h2><div class="panel">${tbl(['Terminal','Status','Last heartbeat','Battery','App version'],S.gates.map(g=>[`<b>${g.n}</b>`,chip(g.on?'ok':'bad',g.on?'Online':'Offline'),g.hb+' ago',g.bat+'%',g.v]))}</div><p>Offline buffer: <b>${S.pend}</b> scans waiting to sync. <button class="btn ghost" onclick="S.pend=0;render();toast('Sync complete')">Sync now</button></p>`},
    settings(){const sw=(l,c)=>`<div class="sw"><span>${l}</span><input type="checkbox" ${c?'checked':''} style="width:auto"></div>`;
    return head('Settings')+`<div class="g2"><div class="panel"><h2 style="margin-top:0">Time windows</h2><p><label>Gates open<input type="time" value="06:00"></label></p><p><label>Late after<input type="time" value="07:30"></label></p><p><label>Escalate unresolved flags after (minutes)<input type="number" value="15"></label></p></div><div class="panel"><h2 style="margin-top:0">Preferences</h2>${sw('Sound for emergency alerts',1)}${sw('Auto-SMS parents on escalation',0)}${sw('Mask student names by default',1)}${sw('Daily backup',1)}<p>Data retention (years)<input type="number" value="3"></p></div></div><button class="btn" onclick="toast('Settings saved')">Save settings</button>`}};
    function render(keep){const m=$('#main'),f=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;m.innerHTML=P[route]();nav();lucide.createIcons();if(keep&&f){const e=$('#'+f);if(e){e.focus();e.setSelectionRange(pos,pos)}}}
    function go(r){location.hash=r}
    function adv(id){const d=S.disc.find(x=>x.id==id);d.st=d.st=='Open'?'Under review':'Resolved';S.audit.unshift([now().slice(0,5),'Sys Admin','Flag '+d.st.toLowerCase(),d.n]);render();toast('Flag: '+d.st)}
    function rel(id,ok){const x=S.queue.find(q=>q.id==id);S.queue=S.queue.filter(q=>q.id!=id);S.plog.unshift({t:now(),n:x.n,g:x.g,by:'Sys Admin',r:ok?'Approved':'Denied'});render();toast(ok?'Pickup approved':'Pickup denied')}
    function registerStudent(){const name=$('#studentName').value.trim(),section=$('#studentSection').value,tag=$('#studentTag').value.trim();if(!name||!section||!tag)return toast('Enter a student name and ID tag');if(!/^[A-Za-z0-9._-]{3,50}$/.test(tag))return toast('Enter a valid student ID tag');if(studentRecords.some(s=>s[0].toLowerCase()==name.toLowerCase()))return toast('That student is already registered');if(studentRecords.some(s=>s[2]&&String(s[2]).toLowerCase()==tag.toLowerCase())||guardianRecords.some(g=>g[5]&&String(g[5]).toLowerCase()==tag.toLowerCase()))return toast('That ID tag is already assigned');studentRecords.push([name,section,tag,'Active']);saveAdminRecords();S.audit.unshift([now(),'Sys Admin','Added student',name]);tab='Students';q='';render();toast('Student added')}
    function deleteStudent(index){const student=studentRecords[index];if(!student)return;const linked=guardianRecords.filter(g=>g[1]==student[0]);const detail=linked.length?' This also removes '+linked.length+' linked guardian record(s).':'';if(!window.confirm('Delete '+student[0]+'?'+detail))return;studentRecords.splice(index,1);for(let i=guardianRecords.length-1;i>=0;i--)if(guardianRecords[i][1]==student[0])guardianRecords.splice(i,1);saveAdminRecords();S.audit.unshift([now(),'Sys Admin','Deleted student',student[0]]);render();toast('Student and linked guardian records deleted')}
    function registerGuardian(){const name=$('#guardianName').value.trim(),student=$('#guardianStudent').value,relation=$('#guardianRelation').value.trim(),type=$('#guardianCardType').value,cardId=$('#guardianCardId').value.trim(),status=$('#guardianVerification').value;if(!name||!student||!relation||!type||!cardId)return toast('Enter the guardian, student, relationship, card type, and card ID');if(!/^[A-Za-z0-9._-]{3,50}$/.test(cardId))return toast('Enter a valid card ID');if(studentRecords.some(s=>s[2]&&String(s[2]).toLowerCase()==cardId.toLowerCase()))return toast('That card ID is already assigned to a student');if(guardianRecords.some(g=>g[5]&&String(g[5]).toLowerCase()==cardId.toLowerCase()))return toast('That guardian card ID is already registered');guardianRecords.push([name,student,relation,status,type,cardId]);saveAdminRecords();S.audit.unshift([now(),'Sys Admin','Registered guardian card',name+' · '+student]);tab='Guardians';q='';render();toast('Guardian registered and card assigned')}
    function saveGuardian(index){const guardian=guardianRecords[index],status=$('#guardianStatus'+index).value,type=$('#guardianType'+index).value,cardId=$('#guardianTag'+index).value.trim();if(!guardian)return;if(!type||!cardId)return toast('Select a card type and enter a card ID');if(!/^[A-Za-z0-9._-]{3,50}$/.test(cardId))return toast('Enter a valid card ID');if(studentRecords.some(s=>s[2]&&String(s[2]).toLowerCase()==cardId.toLowerCase()))return toast('That card ID is already assigned to a student');if(guardianRecords.some((g,i)=>i!=index&&g[5]&&String(g[5]).toLowerCase()==cardId.toLowerCase()))return toast('That guardian card ID is already registered');guardian[3]=status;guardian[4]=type;guardian[5]=cardId;saveAdminRecords();S.audit.unshift([now(),'Sys Admin','Updated guardian card',guardian[0]+' · '+guardian[1]]);render();toast('Guardian card saved')}
    function deleteGuardian(index){const guardian=guardianRecords[index];if(!guardian||!window.confirm('Delete '+guardian[0]+' from '+guardian[1]+'? Their card will no longer authorize pickup.'))return;guardianRecords.splice(index,1);saveAdminRecords();S.audit.unshift([now(),'Sys Admin','Deleted guardian',guardian[0]+' · '+guardian[1]]);render();toast('Guardian deleted')}
    function retry(id){S.fsms=id?S.fsms.filter(f=>f.id!=id):[];render();toast('Message queued for retry')}
    function bcast(){const m=$('#msg').value.trim();if(!m)return toast('Enter a message first');S.alerts.unshift({t:'Today, '+now().slice(0,5),a:$('#aud').value,m,by:'Sys Admin'});render();toast('Broadcast sent')}
    function doTrace(){const v=$('#tq').value.toLowerCase(),f=NM.find(n=>n.toLowerCase().includes(v));if(!v||!f)return toast('No student found');trace={n:f,s:pick(SEC)};render()}
    function route_(){const h=location.hash.slice(1);route=P[h]?h:'overview';render()}
    addEventListener('hashchange',route_);route_();
    setInterval(()=>{scan();if(route=='overview'&&!document.querySelector('.box:hover'))render()},5000);
    </script>
</body>
</html>
