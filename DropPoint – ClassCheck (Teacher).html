<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DropPoint – ClassCheck (Teacher)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>

<style>
    :root{
        --bg:#fff;
        --panel:#fff;
        --ink:#3b3b3b;
        --mut:#777;
        --soft:#e9e7e4;
        --line:#e3e1de;
        --mar:#9b2226;
        --warn:#f7d9d9;
        --ok:#049440;
        --amb:#c98a00;
        --blue:#0090e0;
        padding-top:env(safe-area-inset-top,0px);
        padding-bottom:env(safe-area-inset-bottom,0px)
    }

    @media(prefers-color-scheme:dark){
        :root:not([data-theme=light]){
            --bg:#1b1a19;
            --panel:#272524;
            --ink:#e8e6e3;
            --mut:#a9a5a0;
            --soft:#363332;
            --line:#3d3a38;
            --mar:#e0686c;
            --warn:#4a2a2c
        }
    }

    :root[data-theme=dark]{
        --bg:#1b1a19;
        --panel:#272524;
        --ink:#e8e6e3;
        --mut:#a9a5a0;
        --soft:#363332;
        --line:#3d3a38;
        --mar:#e0686c;
        --warn:#4a2a2c
    }

    html{
        scroll-padding-top:env(safe-area-inset-top,0px)
    }

    *{
        box-sizing:border-box
    }

    body{
        margin:0;
        background:var(--bg);
        color:var(--ink);
        font-family:Poppins,system-ui,sans-serif;
        font-size:14px
    }

    .app{
        display:grid;
        grid-template-columns:260px 1fr;
        gap:8px;padding:14px;
        min-height:100vh
    }

    aside,main{
        background:var(--panel);
        border-radius:26px;
        padding:20px;
        border:1px solid var(--line)
    }

    aside{
        position:sticky;
        top:14px;
        height:calc(100vh - 28px);
        overflow:auto
    }

    .seal{
        display:block;
        width:100%;
        max-width:170px;
        height:auto;
        margin:0 auto 18px
    }

    nav a{
        display:flex;
        align-items:center;
        gap:14px;
        padding:11px 16px;
        margin:2px 0;
        border-radius:12px;
        color:var(--ink);
        text-decoration:none;
        font-weight:500;
        position:relative
    }

    nav a:hover{
        background:var(--soft)
    }
    
    nav a.on{
        color:var(--mar);
        font-weight:700
    }

    nav a.on:before{
        content:"";
        position:absolute;
        left:-20px;
        top:6px;
        bottom:6px;
        width:12px;
        border-radius:0 8px 8px 0;
        background:var(--mar)
    }

    nav svg{
        width:20px;
        height:20px
    }
    
    .bd{
        margin-left:auto;
        background:var(--mar);
        color:#fff;
        border-radius:99px;
        font-size:11px;
        padding:1px 8px
    }

    h1{
        color:var(--mar);
        font-size:24px;
        margin:0 0 12px
    }
    
    h2{
        font-size:18px;
        margin:20px 0 8px;
        font-weight:600
    }

    .sync{
        display:flex;
        gap:10px;
        align-items:center;
        flex-wrap:wrap;
        background:var(--soft);
        border-radius:14px;
        padding:8px 14px;
        margin-bottom:16px;
        font-size:13px
    }

    .sync.off{
        background:var(--warn)
    }

    .sp{
        flex:1
    }

    .btn{
        background:var(--mar);
        color:#fff;
        border:0;
        border-radius:10px;
        padding:8px 14px;
        cursor:pointer;
        font-weight:600;
        font-family:inherit
    }

    .btn.g{
        background:var(--soft);
        color:var(--ink)
    }
    
    .btn.sm{
        padding:4px 10px;
        font-size:12px
    }

    .signin{
        min-height:100vh;
        display:grid;
        place-items:center;
        padding:20px
    }

    .signin[hidden]{
        display:none
    }

    .signin .panel{
        width:min(100%,420px)
    }

    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
        outline:3px solid var(--blue);
        outline-offset:2px
    }

    input,select,textarea{
        font:inherit;
        color:inherit;
        background:var(--panel);
        border:1px solid var(--line);
        border-radius:10px;
        padding:8px 12px;
        width:100%
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:12px
    }

    .card{
        color:#fff;
        border-radius:18px;
        padding:14px 16px
    }
    
    .card small{
        font-size:13px
    }
    
    .card b{
        display:block;
        font-size:28px;
        margin-top:8px
    }

    .next{
        background:var(--mar);
        color:#fff;
        border-radius:20px;
        padding:18px;
        display:flex;
        gap:16px;
        align-items:center;
        flex-wrap:wrap;
        margin-bottom:14px
    }

    .next h3{
        margin:0;
        font-size:20px
    }
    
    .next .btn{
        background:#fff;
        color:#9b2226
    }

    .panel{
        border:1px solid var(--line);
        border-radius:18px;
        padding:14px;
        margin-bottom:14px
    }

    .chip{
        border-radius:8px;
        padding:2px 8px;
        font-size:11px;
        font-weight:600;
        white-space:nowrap;
        display:inline-block
    }

    .c-ok{
        background:#d5f0df;
        color:#066a2d
    }
    
    .c-info{
        background:#dde4ee;
        color:#2b4a73
    }
    
    .c-warn{
        background:#fbe8b8;
        color:#7a5400
    }
    
    .c-bad{
        background:#f7cfd0;
        color:#8a1b1f
    }
    
    .c-n{
        background:var(--soft);
        color:var(--mut)
    }

    .per{
        display:grid;
        grid-template-columns:120px 1fr auto;
        gap:12px;
        align-items:center;
        padding:12px;
        border-top:1px solid var(--line)
    }
    
    .per:first-child{
        border:0
    }

    .muted{
        color:var(--mut)
    }
    
    .g2{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:14px
    }
    
    .tools{
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:12px
    }
    
    .tools input,.tools select{
        width:auto;
        flex:1;
        min-width:130px
    }

    .tally{
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:12px;
        position:sticky;
        top:0;
        background:var(--panel);
        padding:6px 0;
        z-index:2
    }

    .ros{
        display:flex;
        flex-direction:column;
        gap:8px
    }
    
    .ros.grid{
        display:grid;
        grid-template-columns:repeat(auto-fill,minmax(250px,1fr))
    }
    
    .st{
        display:flex;
        gap:10px;
        align-items:center;
        flex-wrap:wrap;
        border:1px solid var(--line);
        border-radius:14px;
        padding:8px 12px
    }

    .av{
        width:38px;
        height:38px;
        border-radius:50%;
        background:var(--mar);
        color:#fff;
        display:grid;
        place-items:center;
        font-weight:700;
        font-size:13px;
        flex:none
    }

    .nm{
        flex:1;
        min-width:140px;
        background:none;
        border:0;
        text-align:left;
        cursor:pointer;
        font:inherit;
        color:inherit;
        padding:0
    }
    
    .nm b{
        display:block
    }

    .seg{
        display:flex;
        gap:4px
    }
    
    .seg button{
        min-width:44px;
        height:40px;
        border:1px solid var(--line);
        border-radius:10px;
        background:var(--panel);
        color:var(--ink);
        font:inherit;
        font-weight:700;
        cursor:pointer
    }

    .seg .on-P{
        background:#049440;
        color:#fff
    }
    
    .seg .on-A{
        background:#9b2226;
        color:#fff
    }
    
    .seg .on-L{
        background:#c98a00;
        color:#fff
    }
    
    .seg .on-E{
        background:#0090e0;
        color:#fff
    }
    
    .seg .on-C{
        background:#6b3f37;
        color:#fff
    }

    .sub{
        position:sticky;
        bottom:calc(8px + env(safe-area-inset-bottom,0px));
        display:flex;
        justify-content:flex-end;
        padding-top:10px
    }
    
    .sub .btn{
        padding:12px 26px;
        box-shadow:0 4px 14px #0004
    }

    .mask{
        position:fixed;
        inset:0;
        background:#0006;
        z-index:20;
        display:grid;
        place-items:center;
        padding:16px
    }

    .mod{
        background:var(--panel);
        border-radius:20px;
        padding:20px;
        max-width:420px;
        width:100%
    }

    .drw{
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        width:min(380px,100%);
        background:var(--panel);
        z-index:21;
        padding:20px;
        overflow:auto;
        box-shadow:-6px 0 24px #0004
    }

    .tl{border-left:3px solid var(--mar);
        padding-left:14px;
        margin:10px 0
    }
    
    .tl p{
        margin:0 0 8px
    }

    .bars{
        display:flex;
        align-items:flex-end;
        gap:10px;
        height:150px
    }
    
    .bars div{
        flex:1;
        text-align:center;
        font-size:11px;
        color:var(--mut)
    }
    
    .bars span{
        display:block;
        background:var(--mar);
        border-radius:8px 8px 0 0;
        margin-bottom:4px
    }

    .sw{
        display:flex;
        justify-content:space-between;
        align-items:center;
        padding:10px 0;
        border-top:1px solid var(--line)
    }
    
    .sw input{
        width:auto
    }

    .wrap{
        overflow-x:auto
    }
    
    table{
        width:100%;
        border-collapse:collapse
    }
    
    th{
        text-align:left;
        color:var(--mut);
        font-weight:500;
        font-size:12px;
        padding:8px
    }
    
    td{
        padding:10px 8px;
        border-top:1px solid var(--line)
    }

    .toast{
        position:fixed;
        bottom:calc(20px + env(safe-area-inset-bottom,0px));
        left:50%;
        transform:translateX(-50%);
        background:#222;
        color:#fff;
        padding:10px 18px;
        border-radius:12px;
        z-index:30
    }

    .tabs{
        display:none
    }

    @media(max-width:900px){
        .app{grid-template-columns:1fr;
            padding:8px
        }
        aside{
            position:static;
            height:auto;
            padding:10p
        }
        .seal{
            display:none
        }
        nav{
            display:flex;
            overflow-x:auto;
            gap:4px
        }
        nav a{
            white-space:nowrap;
            padding:9px 12px
        }
        nav a.on:before{
            display:none
        }
        nav a.on{
            background:var(--soft)
        }
        .cards{
            grid-template-columns:1fr 1fr
        }
        .g2{
            grid-template-columns:1fr
        }
        .per{
            grid-template-columns:1fr auto
        }
        .per>:first-child{
            grid-column:1/-1
        }
        main{
            padding:14px
        }
    }
</style>
</head>

const P={
classes(){const nx=T.per.find(p=>p.st=='In progress'||p.st=='Not started'),C=[['#0090e0','Classes today',T.per.length],['#049440','Submitted',T.per.filter(p=>p.st=='Submitted').length],['#6b3f37','Unsubmitted periods',unsub()],['#96282d','Open flags',openF()]];
return head('Today’s Classes')+`<div class="next"><div class="sp"><small>NEXT CLASS · ${nx.t}</small><h3>${nx.sub} · ${nx.sec}</h3><span>${nx.rm}</span></div><button class="btn" onclick="T.cur=${nx.id};go('attendance')">Take Attendance</button></div><div class="cards">${C.map(c=>`<div class="card" style="background:${c[0]}"><small>${c[1]}</small><b>${c[2]}</b></div>`).join('')}</div><h2>Schedule</h2><div class="panel">${T.per.map(p=>`<div class="per"><b>${p.t}</b><div><b>${p.sub}</b><br><span class="muted">${p.sec} · ${p.rm}</span></div><div>${chip(pst[p.st],p.st)} ${p.st!='Submitted'?`<button class="btn sm" onclick="T.cur=${p.id};go('attendance')">Open</button>`:''}</div></div>`).join('')}</div>`},
attendance(){const p=cur(),a=att(),c=tally(a),lock=p.st=='Submitted',unm=NM.length-Object.keys(a).length;
const rows=NM.map((n,i)=>[n,i]).filter(([n])=>n.toLowerCase().includes(T.fq.toLowerCase())&&(!T.ff||(T.ff=='U'?!a[n]:a[n]==T.ff)));
return head('Take Attendance')+`<div class="tools"><select aria-label="Period" onchange="T.cur=+this.value;render()">${T.per.map(x=>`<option value="${x.id}" ${x.id==T.cur?'selected':''}>${x.t} · ${x.sub} · ${x.sec}</option>`).join('')}</select></div><div class="tally">${chip('ok',c.P+' present')}${chip('bad',c.A+' absent')}${chip('warn',c.L+' late')}${chip('info',c.E+' excused')}${chip('n',c.C+' clinic')}${chip('n',unm+' unmarked')}</div>${lock?'':`<div class="tools"><input id="newStudentName" aria-label="New student name" placeholder="Student name to add"><button class="btn" onclick="addRosterStudent()">Add student</button></div>`}
<div class="tools"><input id="fq" placeholder="Search student" aria-label="Search" value="${T.fq}" oninput="T.fq=this.value;render(1)"><select aria-label="Filter" onchange="T.ff=this.value;render()"><option value="">All statuses</option><option value="U" ${T.ff=='U'?'selected':''}>Unmarked</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${T.ff==k?'selected':''}>${v}</option>`).join('')}</select>${lock?`<button class="btn g" onclick="editReq()">Edit submitted</button>`:`<button class="btn g" onclick="markAll()">Mark all present</button><button class="btn g" onclick="qscan()">${I('scan-line')} Quick scan</button>`}</div>
<div class="ros ${T.view=='grid'?'grid':''}">${rows.map(([n,i])=>`<div class="st"><span class="av">${n.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><button class="nm" onclick="T.sv=${i};render()"><b>${n}</b>${SC[n]?chip('ok','Scanned in '+SC[n]):chip('warn','No gate scan')}</button><div class="seg" role="group" aria-label="Status for ${n}">${Object.keys(ST).map(k=>`<button title="${ST[k]}" aria-label="${ST[k]}" aria-pressed="${a[n]==k}" class="${a[n]==k?'on-'+k:''}" ${lock?'disabled':''} onclick="mark(${i},'${k}')">${k}</button>`).join('')}</div></div>`).join('')}</div>
<p class="muted">P Present · A Absent · L Late · E Excused · C Clinic/Official business</p>${lock?'':`<div class="sub"><button class="btn" onclick="submitReq()">Submit attendance</button></div>`}`},
flags(){return head('Gate-vs-Class Flags')+`<p class="muted">Flags sync to the admin’s Mismatch Radar.</p>`+T.flags.map(f=>`<div class="panel"><div class="tools"><b class="sp">${f.n}</b>${chip(pst[f.st],f.st)}</div><p>${f.t==('In class, no gate scan')?'In class, but no gate scan. Likely a missed scan or offline sync.':'Where is this student? Scanned in at the gate but marked absent in class.'} <span class="muted">(${f.p})</span></p>${f.st=='Resolved'?`<p class="muted">Outcome: ${f.out}${f.note?' · '+f.note:''}</p>`:`<textarea rows="2" placeholder="Notes for context" oninput="T.flags.find(x=>x.id==${f.id}).note=this.value">${f.note}</textarea><div class="tools" style="margin-top:8px"><button class="btn sm" onclick="fa(${f.id},'Confirmed absent')">Confirm absent</button><button class="btn sm g" onclick="fa(${f.id},'Found in class, record corrected')">Found in class</button><button class="btn sm g" onclick="fa(${f.id},'At clinic/office')">At clinic/office</button><button class="btn sm g" onclick="fa(${f.id},'Escalated to admin',1)">Escalate to admin</button></div>`}</div>`).join('')},
excuses(){return head('Absence and Excuse Handling')+`<div class="g2"><div class="panel"><h2 style="margin-top:0">New excuse slip</h2><p><select id="en">${NM.map(n=>`<option>${n}</option>`).join('')}</select></p><p><input id="er" placeholder="Reason"></p><p><label class="muted">Photo of parent’s letter<input type="file" accept="image/*"></label></p><button class="btn" onclick="addEx()">Save slip</button></div><div class="panel"><h2 style="margin-top:0">Repeated absence alerts</h2><p>${chip('bad','3 days')} <b>Jenny Aquino</b><br><span class="muted">3 consecutive absences</span></p><p>${chip('warn','5 lates')} <b>Pedro Lim</b><br><span class="muted">5 lates this month</span></p></div></div><h2>Pending excuses</h2><div class="panel">${tbl(['Student','Reason','Status',''],T.exc.map(e=>[`<b>${e.n}</b>`,e.r,chip(pst[e.st],e.st),e.st=='Pending'?`<button class="btn sm" onclick="ex(${e.id},'Approved')">Approve</button> <button class="btn sm g" onclick="ex(${e.id},'Forwarded')">Forward to adviser</button>`:'']))}</div>`},
adviser(){return head('Adviser Tools')+`<p class="muted">Homeroom: G10 – Rizal</p>${tbl(['Period','Present','Absent','Late'],[['P1 Mathematics',10,1,1],['P2 Science',11,1,0],['P4 English',11,0,1]])}<div class="g2"><div class="panel"><h2 style="margin-top:0">Frequent late or absent</h2><p><b>Pedro Lim</b> ${chip('warn','5 lates')}</p><p><b>Jenny Aquino</b> ${chip('bad','3 absences')}</p></div><div class="panel"><h2 style="margin-top:0">Parent notification status</h2><p>${chip('ok','34 delivered')} ${chip('bad','2 failed')} ${chip('warn','1 pending')}</p><button class="btn" onclick="toast('Monthly summary prepared')">Monthly summary for report cards</button></div></div>`},
messages(){return head('Notifications')+`<div class="g2"><div class="panel">${T.notif.map(n=>`<p>${chip(n[1]=='Reminder'?'warn':n[1]=='Flag'?'bad':'info',n[1])} ${n[0]} <span class="muted">${n[2]}</span></p>`).join('')}</div><div class="panel"><h2 style="margin-top:0">Quick message</h2><p><select id="mt"><option>Admin</option><option>Gate guard</option></select></p><p><textarea id="mm" rows="3" placeholder="Student concern (not sent to parents)"></textarea></p><button class="btn" onclick="sendM()">Send</button></div></div>`},
reports(){const D={Daily:[['P1',96],['P2',92],['P3',94],['P4',90],['P5',95]],Weekly:[['Mon',96],['Tue',94],['Wed',95],['Thu',91],['Fri',89]],Monthly:[['Wk1',95],['Wk2',93],['Wk3',92],['Wk4',94]]}[T.rng||'Daily'];
return head('Reports')+`<div class="tools">${['Daily','Weekly','Monthly'].map(r=>`<button class="btn ${(T.rng||'Daily')==r?'':'g'}" onclick="T.rng='${r}';render()">${r}</button>`).join('')}</div><div class="panel"><b>Attendance rate (%)</b><div class="bars">${D.map(x=>`<div><span style="height:${x[1]*1.3}px"></span>${x[0]}</div>`).join('')}</div></div><div class="tools"><button class="btn" onclick="toast('PDF (DepEd format) exported')">Export PDF</button><button class="btn g" onclick="toast('CSV exported')">Export CSV</button><button class="btn g" onclick="print()">Print student record</button></div>`},
profile(){const sw=(k,l)=>`<div class="sw"><span>${l}</span><input type="checkbox" ${T.pref[k]?'checked':''} onchange="T.pref['${k}']=this.checked?1:0"></div>`,teacher=teacherRecord(teacherId),account=teacherAccount(teacherId);
return head('Profile and Preferences')+`<div class="g2"><div class="panel"><h2 style="margin-top:0">${escapeHTML(teacher.n)}</h2><p class="muted">Mathematics teacher · Adviser of G10 – Rizal</p><p><b>Teacher ID</b><br>${escapeHTML(teacherId)}</p><p><b>Username</b><br>${escapeHTML(account.username)}</p><p><b>Email</b><br>${escapeHTML(account.email)}</p><p><b>Assigned sections</b><br>G10 – Rizal · G9 – Luna · G8 – Bonifacio</p><p><b>Default roster view</b><select onchange="T.view=this.value"><option value="list" ${T.view=='list'?'selected':''}>List</option><option value="grid" ${T.view=='grid'?'selected':''}>Grid</option></select></p></div><div class="panel"><h2 style="margin-top:0">Notifications</h2>${sw('flag','New flag alerts')}${sw('remind','Missed-submission reminders')}${sw('admin','Admin requests')}<p><button class="btn g" onclick="toast('Password reset link sent')">Change password</button> <button class="btn" onclick="signOutTeacher()">Sign out</button></p></div></div>`}};
function nav(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<a href="#${k}" class="${k==route?'on':''}" ${k==route?'aria-current="page"':''}>${I(i)}${l}${k=='flags'&&openF()?`<span class="bd">${openF()}</span>`:''}</a>`).join('')}
let route='classes';
function drawer(){if(T.sv===null)return'';const n=NM[T.sv],rv=T.rev==T.sv;return`<div class="drw" role="dialog" aria-label="Student quick view"><div class="tools"><b class="sp" style="font-size:18px">${n}</b><button class="btn sm g" onclick="T.sv=null;render()">Close</button></div><div class="tl"><p>${SC[n]?'Gate in '+SC[n]:'No gate scan today'}</p><p>P1 Math: ${ST[(T.att[1]||{})[n]]||'Not marked'}</p><p>P3 Math: ${ST[att()[n]]||'Not marked'}</p><p class="muted">Gate out: not yet</p></div><p><b>History</b><br>${chip('bad','2 absences')} ${chip('warn','3 lates')} ${chip('ok','Streak: 4 days present')}</p><p><b>Guardian contact</b><br>${rv?'+63 917 555 2210':'+63 9•• ••• ••10'} <button class="btn sm g" onclick="T.rev=${T.sv};render();toast('Reveal logged to access trail')">${rv?'Revealed':'Reveal'}</button></p><p><b>My notes</b><textarea rows="3" oninput="T.notes[NM[${T.sv}]]=this.value">${T.notes[n]||''}</textarea></p></div>`}
function render(keep){const app=document.querySelector('.app'),login=$('#signin');if(!teacherId){app.style.display='none';login.hidden=false;login.innerHTML=authMode=='signup'?`<div class="panel"><h1 style="margin-top:0">Create teacher account</h1><p class="muted">Your teacher ID must already be in the system admin directory.</p><form onsubmit="signUpTeacher(event)"><p><label for="signup-username">Username</label><input id="signup-username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9._]+" autocomplete="username"></p><p><label for="signup-email">Email</label><input id="signup-email" type="email" required autocomplete="email"></p><p><label for="signup-password">Password</label><input id="signup-password" type="password" required minlength="8" autocomplete="new-password"></p><p><label for="signup-id">Teacher ID number</label><input id="signup-id" type="text" inputmode="numeric" pattern="[0-9]+" required></p><button class="btn" type="submit">Create account</button> <button class="btn g" type="button" onclick="authMode='login';render()">Back to log in</button></form><p class="muted">This prototype stores accounts on this device; it is not server authentication.</p></div>`:`<div class="panel"><h1 style="margin-top:0">Teacher log in</h1><p class="muted">Log in with the teacher ID and password registered for your account.</p><form onsubmit="signInTeacher(event)"><p><label for="login-id">Teacher ID number</label><input id="login-id" type="text" inputmode="numeric" pattern="[0-9]+" required autocomplete="username"></p><p><label for="login-password">Password</label><input id="login-password" type="password" required autocomplete="current-password"></p><button class="btn" type="submit">Log in</button></form><p><button class="btn g" onclick="authMode='signup';render()">Create an account</button></p><p class="muted">Accounts are local to this prototype and cannot authenticate with a server.</p></div>`;return}login.hidden=true;login.innerHTML='';app.style.display='';const f=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;$('#main').innerHTML=P[route]();$('#ov').querySelector('.drw')?.remove();if(T.sv!==null)$('#ov').insertAdjacentHTML('beforeend',drawer());nav();lucide.createIcons();if(keep&&f&&$('#'+f)){$('#'+f).focus();$('#'+f).setSelectionRange(pos,pos)}}
function go(r){location.hash=r}
const bytesToHex=bytes=>Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
const hexToBytes=hex=>new Uint8Array(hex.match(/.{2}/g).map(b=>parseInt(b,16)));
async function passwordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(salt),iterations:120000,hash:'SHA-256'},key,256);return bytesToHex(new Uint8Array(bits))}
async function signUpTeacher(event){event.preventDefault();const username=$('#signup-username').value.trim(),email=$('#signup-email').value.trim().toLowerCase(),password=$('#signup-password').value,id=$('#signup-id').value.trim();if(!/^\d+$/.test(id))return toast('Enter a valid teacher ID number');if(!teacherRecord(id))return toast('Teacher ID is not in the admin directory. Contact the system admin.');if(!/^[A-Za-z0-9._]{3,30}$/.test(username))return toast('Username must be 3–30 letters, numbers, dots, or underscores');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast('Enter a valid email address');if(password.length<8)return toast('Password must be at least 8 characters');let accounts=teacherAccounts();if(accounts.some(a=>a.id==id))return toast('An account already exists for this teacher ID');if(accounts.some(a=>a.username.toLowerCase()==username.toLowerCase()||a.email.toLowerCase()==email))return toast('That username or email is already in use');const saltBytes=crypto.getRandomValues(new Uint8Array(16)),salt=bytesToHex(saltBytes);let hash;try{hash=await passwordHash(password,salt)}catch(error){console.error('Unable to secure teacher password',error);return toast('Could not secure the password on this device')}if(!teacherRecord(id))return toast('Teacher ID is no longer in the admin directory');accounts=teacherAccounts();if(accounts.some(a=>a.id==id))return toast('An account already exists for this teacher ID');if(accounts.some(a=>a.username.toLowerCase()==username.toLowerCase()||a.email.toLowerCase()==email))return toast('That username or email is already in use');accounts.push({id,username,email,salt,hash,createdAt:new Date().toISOString()});localStorage.setItem('dropPointTeacherAccounts',JSON.stringify(accounts));authMode='login';render();toast('Account created. Log in with your teacher ID and password.')}
async function signInTeacher(event){event.preventDefault();const id=$('#login-id').value.trim(),password=$('#login-password').value;if(!/^\d+$/.test(id))return toast('Enter a valid teacher ID number');if(!teacherRecord(id))return toast('Teacher ID is not in the admin directory');const account=teacherAccount(id);if(!account)return toast('No account exists for this teacher ID. Create an account first.');let hash;try{hash=await passwordHash(password,account.salt)}catch(error){console.error('Unable to verify teacher password',error);return toast('Could not verify the password on this device')}if(hash!==account.hash)return toast('Teacher ID or password is incorrect');teacherId=id;localStorage.setItem('classcheckTeacherId',id);route='classes';location.hash='classes';render();toast('Logged in')}
function signOutTeacher(){localStorage.removeItem('classcheckTeacherId');teacherId='';T.sv=null;authMode='login';location.hash='';render();toast('Logged out')}
function addRosterStudent(){if(cur().st=='Submitted')return toast('Edit submitted attendance before changing the roster');const field=$('#newStudentName'),name=field.value.trim();if(!/^\p{L}[\p{L}\p{M} .'-]{0,59}$/u.test(name))return toast('Enter a valid student name');if(NM.some(n=>n.toLowerCase()==name.toLowerCase()))return toast('That student is already in the roster');NM.push(name);localStorage.setItem('classcheckRoster',JSON.stringify(NM));render();toast(name+' added to the roster')}
function mark(i,k){const n=NM[i],a=att();a[n]=k;
const bad=(k=='A'&&SC[n])?'Scanned in at gate, marked absent':(k=='P'&&!SC[n])?'In class, no gate scan':null;
if(bad&&!T.flags.find(f=>f.n==n&&f.t==bad))T.flags.unshift({id:Date.now(),n,p:'P'+T.cur+' Math',t:bad,st:'Open',note:''});render();}
function markAll(){const a=att();NM.forEach(n=>{if(!a[n])a[n]='P'});T.flags=T.flags.slice();render();toast('Unmarked students set to Present')}
function qscan(){const a=att(),n=NM.find(x=>!a[x]);if(!n)return toast('Everyone is marked');a[n]='P';render();toast('Scanned: '+n+' marked present')}
function submitReq(){const c=tally(att()),u=NM.length-Object.keys(att()).length;modal(`<h2 style="margin-top:0">Submit attendance?</h2><p>${c.P} present, ${c.A} absent, ${c.L} late, ${c.E} excused, ${c.C} clinic.</p>${u?`<p>${chip('warn',u+' unmarked will count as absent')}</p>`:''}<div class="tools"><button class="btn" onclick="doSubmit()">Confirm and submit</button><button class="btn g" onclick="modal()">Review</button></div>`)}
function doSubmit(){const a=att();NM.forEach(n=>{if(!a[n])a[n]='A'});cur().st='Submitted';if(T.off)T.pend++;modal();render();toast(T.off?'Saved on this device. Will sync later.':'Attendance submitted')}
function editReq(){modal(`<h2 style="margin-top:0">Edit submitted attendance</h2><p class="muted">A reason is required and will be logged.</p><textarea id="er2" rows="3" placeholder="Reason for edit"></textarea><div class="tools" style="margin-top:10px"><button class="btn" onclick="doEdit()">Unlock for edit</button><button class="btn g" onclick="modal()">Cancel</button></div>`)}
function doEdit(){const r=$('#er2').value.trim();if(!r)return toast('Reason is required');T.log.push([now(),T.cur,r]);cur().st='In progress';modal();render();toast('Edit logged')}
function fa(id,out,esc){const f=T.flags.find(x=>x.id==id);f.out=out;f.st=esc?'Under review':'Resolved';if(esc)f.st='Under review';render();toast(out)}
function addEx(){const r=$('#er').value.trim();if(!r)return toast('Enter a reason');T.exc.unshift({id:Date.now(),n:$('#en').value,r,st:'Pending'});render();toast('Excuse slip saved')}
function ex(id,s){T.exc.find(e=>e.id==id).st=s;render()}
function sendM(){if(!$('#mm').value.trim())return toast('Type a message first');toast('Sent to '+$('#mt').value);$('#mm').value=''}
function doSync(){if(T.off)return toast('Still offline');T.pend=0;T.last=now();render();toast('Synced')}
function r_(){const h=location.hash.slice(1);route=P[h]?h:'classes';render()}
addEventListener('hashchange',r_);addEventListener('keydown',e=>{if(e.key=='Escape'){modal();if(T.sv!==null){T.sv=null;render()}}});r_();
addEventListener('storage',e=>{if(teacherId&&(e.key=='dropPointTeacherAccounts'||e.key=='dropPointAdminData')&&(!teacherRecord(teacherId)||!teacherAccount(teacherId)))signOutTeacher()});
</script>
</body>
</html>
